<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <rect width="1600" height="920" fill="#f6f8f3"/>
  <text x="90" y="100" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#19372b">경쟁환경 UI 분석 · 현재 장소 탐색 vs 다음 지역 발견</text>
  <text x="90" y="145" font-family="Arial, sans-serif" font-size="21" fill="#66766b">실제 서비스의 브랜드 화면이 아닌, 사용자 경험 구조를 비교한 분석용 도식입니다.</text>
  <g transform="translate(90 205)">
    <rect width="330" height="560" rx="24" fill="#fff" stroke="#d9e3d8" stroke-width="3"/>
    <rect width="330" height="78" rx="24" fill="#edf2ff"/><circle cx="40" cy="39" r="20" fill="#4d6bd7"/><text x="74" y="47" font-family="Arial" font-size="25" font-weight="700" fill="#20356e">네이버 지도/플레이스</text>
    <text x="28" y="125" font-family="Arial" font-size="18" font-weight="700" fill="#263b31">핵심 화면</text><text x="28" y="157" font-family="Arial" font-size="20" fill="#263b31">검색 · 리뷰 · 평점 · 길찾기</text>
    <rect x="28" y="190" width="274" height="150" rx="12" fill="#f1f4ff"/><circle cx="165" cy="264" r="45" fill="#c8d4ff"/><text x="81" y="229" font-family="Arial" font-size="17" fill="#4d6bd7">현재 인기 장소 카드</text><text x="89" y="320" font-family="Arial" font-size="16" fill="#53649f">조건 입력 → 장소/코스 추천</text>
    <text x="28" y="392" font-family="Arial" font-size="18" font-weight="700" fill="#263b31">강점</text><text x="28" y="426" font-family="Arial" font-size="17" fill="#66766b">현재 장소 탐색·동선 연결</text><text x="28" y="465" font-family="Arial" font-size="18" font-weight="700" fill="#263b31">빈틈</text><text x="28" y="499" font-family="Arial" font-size="17" fill="#66766b">이미 알려진 곳 중심</text>
  </g>
  <g transform="translate(465 205)">
    <rect width="330" height="560" rx="24" fill="#fff" stroke="#d9e3d8" stroke-width="3"/>
    <rect width="330" height="78" rx="24" fill="#fff0e5"/><circle cx="40" cy="39" r="20" fill="#e89039"/><text x="74" y="47" font-family="Arial" font-size="25" font-weight="700" fill="#77441d">카카오맵·AI</text>
    <text x="28" y="125" font-family="Arial" font-size="18" font-weight="700" fill="#263b31">핵심 화면</text><text x="28" y="157" font-family="Arial" font-size="20" fill="#263b31">지도 · 일정 · 맥락형 추천</text>
    <rect x="28" y="190" width="274" height="150" rx="12" fill="#fff5ed"/><path d="M50 294 Q110 218 165 274 T280 230" fill="none" stroke="#e89039" stroke-width="8"/><text x="83" y="225" font-family="Arial" font-size="17" fill="#b0672a">상황 기반 추천</text><text x="80" y="320" font-family="Arial" font-size="16" fill="#9b704d">약속·일정 → 장소 제안</text>
    <text x="28" y="392" font-family="Arial" font-size="18" font-weight="700" fill="#263b31">강점</text><text x="28" y="426" font-family="Arial" font-size="17" fill="#66766b">일상 맥락·장소 연결</text><text x="28" y="465" font-family="Arial" font-size="18" font-weight="700" fill="#263b31">빈틈</text><text x="28" y="499" font-family="Arial" font-size="17" fill="#66766b">지역 변화의 근거는 약함</text>
  </g>
  <g transform="translate(840 205)">
    <rect width="330" height="560" rx="24" fill="#fff" stroke="#d9e3d8" stroke-width="3"/>
    <rect width="330" height="78" rx="24" fill="#f7edf9"/><circle cx="40" cy="39" r="20" fill="#a85fc0"/><text x="74" y="47" font-family="Arial" font-size="25" font-weight="700" fill="#63396f">데이트팝</text>
    <text x="28" y="125" font-family="Arial" font-size="18" font-weight="700" fill="#263b31">핵심 화면</text><text x="28" y="157" font-family="Arial" font-size="20" fill="#263b31">테마 · 코스 · 제휴 장소</text>
    <rect x="28" y="190" width="274" height="150" rx="12" fill="#fbf3fc"/><rect x="54" y="230" width="64" height="72" rx="8" fill="#e8c7ef"/><rect x="133" y="230" width="64" height="72" rx="8" fill="#d9b7e5"/><rect x="212" y="230" width="64" height="72" rx="8" fill="#eccfe9"/><text x="75" y="220" font-family="Arial" font-size="17" fill="#8f4da4">테마별 코스 큐레이션</text>
    <text x="28" y="392" font-family="Arial" font-size="18" font-weight="700" fill="#263b31">강점</text><text x="28" y="426" font-family="Arial" font-size="17" fill="#66766b">목적형 방문 코스·콘텐츠</text><text x="28" y="465" font-family="Arial" font-size="18" font-weight="700" fill="#263b31">빈틈</text><text x="28" y="499" font-family="Arial" font-size="17" fill="#66766b">현재 방문 코스에 집중</text>
  </g>
  <g transform="translate(1215 205)">
    <rect width="330" height="560" rx="24" fill="#173e2e" stroke="#173e2e" stroke-width="3"/>
    <rect width="330" height="78" rx="24" fill="#2d6346"/><circle cx="40" cy="39" r="20" fill="#dbeebc"/><text x="74" y="47" font-family="Arial" font-size="25" font-weight="700" fill="#f4f8ec">NEXT SPOT</text>
    <text x="28" y="125" font-family="Arial" font-size="18" font-weight="700" fill="#cce3b7">핵심 화면</text><text x="28" y="157" font-family="Arial" font-size="20" fill="#fff">변화 신호 · 후보 지도 · 근거</text>
    <rect x="28" y="190" width="274" height="150" rx="12" fill="#255640"/><path d="M53 301 L104 278 L154 286 L205 234 L277 215" fill="none" stroke="#cde89d" stroke-width="8"/><circle cx="205" cy="234" r="10" fill="#f0a13a"/><text x="80" y="218" font-family="Arial" font-size="17" fill="#e0f1c7">지역 변화 속도</text><text x="80" y="320" font-family="Arial" font-size="16" fill="#cce3b7">설치·상권·생활인구 근거</text>
    <text x="28" y="392" font-family="Arial" font-size="18" font-weight="700" fill="#cce3b7">강점</text><text x="28" y="426" font-family="Arial" font-size="17" fill="#fff">과밀 전 지역 선발견</text><text x="28" y="465" font-family="Arial" font-size="18" font-weight="700" fill="#cce3b7">차별점</text><text x="28" y="499" font-family="Arial" font-size="17" fill="#fff">왜 추천하는지 데이터로 설명</text>
  </g>
  <text x="90" y="840" font-family="Arial" font-size="23" font-weight="700" fill="#19372b">핵심 포지션</text><text x="90" y="875" font-family="Arial" font-size="25" fill="#19372b">현재 유명한 장소를 찾는 UX  →  아직 과밀하지 않은 다음 지역을 발견하는 UX</text>
</svg>
